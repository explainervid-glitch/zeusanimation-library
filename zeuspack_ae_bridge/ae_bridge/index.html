<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ZeusPack</title>
<style>
  /* Inter, bundled in fonts/. These declarations are what actually load it —
     naming "Inter" in a font stack without them only works if the font happens
     to be installed system-wide, which it previously wasn't. CEF loads woff2
     over file:// thanks to the manifest's file-access flags.
     `swap` rather than `block` so text is never invisible if a file is missing. */
  @font-face {
    font-family:"Inter"; src:url("./fonts/Inter-Regular.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face {
    font-family:"Inter"; src:url("./fonts/Inter-Medium.woff2") format("woff2");
    font-weight:500; font-style:normal; font-display:swap;
  }
  @font-face {
    font-family:"Inter"; src:url("./fonts/Inter-SemiBold.woff2") format("woff2");
    font-weight:600; font-style:normal; font-display:swap;
  }

  /* UI TEXT IS WHITE AT REST.
     Nothing is dimmed just because it is idle: --text is the colour for every
     label, and hover feedback comes from a background or border change instead
     of from brightening the type.

     Four things stay dim ON PURPOSE, because they carry meaning rather than
     decoration: a DISABLED menu item (.menu button.off) and an offline preset
     root (.path option:disabled), which have to read as unavailable; input
     PLACEHOLDER text, which must not look like a value you already typed; and
     the "(Uncategorize)" row (.cat.root), which is a leftovers bucket rather
     than a category anyone chose to make.

     The grid's own text is dimmed too (.meta .nm, .tag, .thumb .ph): a folder
     of cards is mostly labels, and they should sit behind the previews rather
     than compete with them. Hover and selection bring them back to full white.
     Semantic colours (ok/err/accent, and the FX/FX+/Comp badge colours) are
     information too and are left alone. */
  :root {
    --bg:#1e1e1e; --panel:#252526; --border:#3a3a3a;
    --text:#ffffff; --muted:#9a9a9a; --accent:#066ce7;
    --ok:#3fb950; --err:#f85149;
    /* Card width and thumbnail height, driven by the size slider. The pair is
       always kept at the preview comp's aspect ratio (see panel.js), so a
       rendered preview fills the tile with nothing cropped. */
    --card-w:96px; --thumb-h:54px;
    --cats-w:84px;              /* category rail, dragged by its right edge */
    --tools-w:92px;             /* tool strip, dragged by its left edge */

    /* Corner rounding for all panel chrome, routed through one knob so the
       whole UI can be flipped between rounded and sharp in one place. Set to
       0px for sharp corners; the previous look was 5px.
       --r      : panels, buttons, inputs, cards, the right-click menu
       --r-sm   : small chips (tags, category pills, the log's tool buttons)
       Fully round things (the status dot, the slider knob, scrollbar thumbs)
       are NOT routed through this — they are dots by intent, not rounded
       rectangles, and a square status dot would just read as a bug. */
    --r:0px; --r-sm:0px;
  }

  /* The grid's scrollbar is subtracted from the track area, so a fat default
     one costs a whole column in a 240px docked panel. */
  .list::-webkit-scrollbar { width:6px; }
  .list::-webkit-scrollbar-track { background:transparent; }
  .list::-webkit-scrollbar-thumb { background:#3f3f46; border-radius:99px; }
  .list::-webkit-scrollbar-thumb:hover { background:#52525b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body {
    background:var(--bg); color:var(--text);
    /* Inter is bundled (see @font-face above), so it renders identically on
       every machine; Segoe UI is the Windows fallback if a file is missing. */
    font:11px/1.4 "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex; flex-direction:column; padding:5px 7px; gap:5px;
    /* No text selection by default — dragging across the card grid otherwise
       paints preset names blue, which reads as a broken drag-and-drop. */
    -webkit-user-select:none; user-select:none; cursor:default;
  }

  /* …except the text you actually need to copy out of the panel. */
  .path, .state, .loglines {
    -webkit-user-select:text; user-select:text; cursor:text;
  }

  /* One compact status row: dot + state + actions. flex:0 0 auto so the row
     never stretches — collapsed, the body is exactly this tall. */
  .bar { flex:0 0 auto; display:flex; align-items:center; gap:7px; height:22px; }
  /* The two side zones grow equally (flex:1 1 0), so the segmented control
     between them is pinned to the bar's centre no matter what the sides hold.
     min-width:0 lets them shrink (and the status text ellipsize) before they
     ever push the centre off-centre. */
  .barside { flex:1 1 0; min-width:0; display:flex; align-items:center; gap:7px; }
  .barside.right { justify-content:flex-end; }

  /* Hit area for the dot. Transparent and borderless so the bar still reads as
     "a dot", while giving the click something to land on. */
  .dotbtn {
    width:16px; height:16px; padding:0; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border:0; cursor:pointer;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.ok { background:var(--ok); } .dot.err { background:var(--err); }
  .dotbtn:hover .dot { box-shadow:0 0 0 3px rgba(6,108,231,.25); }

  .state { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
  /* Hidden by default: the dot's colour already carries connection state, and
     its tooltip carries the words. `visibility` rather than `display` keeps the
     element as the flex spacer, so hiding the text does not slide the toolbar
     buttons left — the bar looks identical either way. */
  .state.off { visibility:hidden; }
  .state b { color:var(--text); font-weight:600; }
  /* The row's text is set with textContent, never markup — it carries asset and
     folder names — so emphasis comes from these classes instead of a <b>. */
  .state.msg { color:var(--text); font-weight:600; }
  .state.err { color:var(--err);  font-weight:600; }

  .ico {
    width:22px; height:22px; padding:0; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--border); border-radius:var(--r);
    color:var(--text); cursor:pointer;
  }
  .ico:hover { color:var(--text); border-color:var(--accent); }
  .ico:disabled { opacity:.4; cursor:default; }
  /* Active toggle: filled accent, like the settings-modal toggles — reads
     clearly as "on" rather than an accent-tinted outline. */
  .ico.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .ico.on:hover { color:#fff; }
  .ico svg { width:12px; height:12px; display:block; }

  /* Labelled variant: icon + text. margin rather than flex `gap`, which only
     landed in Chrome 84 — the manifest still claims CEP 9 support. */
  .ico.lbl { width:auto; padding:0 6px; }
  .ico.lbl svg { margin-right:4px; }
  .ico.lbl span { font-size:10px; font-weight:600; line-height:1; white-space:nowrap; }

  /* The three view toggles read as one control, so they sit flush: only the
     outer corners round, and the shared edges collapse to a single 1px line.
     -1px margin rather than dropping one side's border, so a button that is
     .on (or hovered) can still draw an accent outline on all four sides; the
     z-index lifts that outline above its neighbours' plain border. */
  .seg { display:flex; flex-shrink:0; }
  .seg .ico { position:relative; border-radius:0; }
  .seg .ico + .ico { margin-left:-1px; }
  .seg .ico:first-child { border-radius:var(--r) 0 0 var(--r); }
  .seg .ico:last-child  { border-radius:0 var(--r) var(--r) 0; }
  .seg .ico:hover, .seg .ico.on { z-index:1; }

  /* Update badge — accent-filled so it reads as a notice, not another toggle. */
  .ico.upd {
    background:var(--accent); border-color:var(--accent); color:#fff;
  }
  .ico.upd:hover { background:#0a5ec4; border-color:#0a5ec4; color:#fff; }

  /* Log — collapsed by default, only takes space when opened.
     Two parts: a fixed header row for the log's own actions, and a separate
     scrolling area for the lines. They MUST be separate containers — the trim
     that caps the log at 200 entries removes firstChild, so anything sharing a
     parent with the lines would eventually be removed along with them. */
  .log {
    display:none; flex:1; min-height:70px; min-width:0; flex-direction:column;
    background:#151515; border:1px solid var(--border); border-radius:var(--r);
    padding:5px 6px;
  }
  .log.open { display:flex; }
  .logbar {
    flex:0 0 auto; display:flex; align-items:center;
    padding-bottom:4px; margin-bottom:4px; border-bottom:1px solid #2a2a2a;
  }
  .loglines {
    flex:1; min-height:0; overflow:auto; font-size:10px;
    /* Inter like the rest of the UI. It is not monospace, so log timestamps no
       longer align in a column — switch this back to Consolas, monospace if
       that matters. */
    font-family:inherit;
    color:var(--text); white-space:pre-wrap; word-break:break-word;
  }
  .loglines .ok  { color:var(--ok); }
  .loglines .err { color:var(--err); }

  /* Preset browser + tool strip, side by side. Hidden outright when both are
     closed — an empty flex:1 row would otherwise hold the panel open. */
  .main { display:none; }
  .main.open { display:flex; flex:1; min-height:0; min-width:0; gap:0; }

  /* ── Layer tools — a vertical strip on the right ── */
  .tools {
    display:none; flex:0 0 var(--tools-w); min-width:0;
    overflow-y:auto; overflow-x:hidden;
    background:#151515; border:1px solid var(--border); border-radius:var(--r);
    padding:4px;
  }
  .tools.open { display:block; }

  /* Tools are grouped by what they act on. The heading is the only thing that
     says a group exists, so it has to stay legible when the strip is dragged
     narrow: it ellipsizes rather than wrapping to a second line and shoving
     the buttons down. */
  .tgroup { margin-bottom:7px; }
  .tgroup:last-child { margin-bottom:0; }
  .thead {
    display:flex; align-items:center;
    font-size:8px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
    color:var(--text); padding:0 2px 3px;
  }
  .tname { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tools::-webkit-scrollbar { width:6px; }
  .tools::-webkit-scrollbar-track { background:transparent; }
  .tools::-webkit-scrollbar-thumb { background:#3f3f46; border-radius:99px; }

  /* Drag handle on the strip's LEFT edge — wider than it looks so it is
     actually grabbable, matching .catgrip. */
  .toolgrip { display:none; flex:0 0 7px; position:relative; cursor:col-resize; }
  .toolgrip.open { display:block; }
  .toolgrip::after {
    content:""; position:absolute; top:0; bottom:0; left:3px; width:1px;
    background:transparent;
  }
  .toolgrip:hover::after, .toolgrip.drag::after { background:var(--accent); }

  /* Tool buttons: icon over label, filling the strip's width so they grow with
     it. Full width of whatever the strip currently is; on its own it becomes a
     wide ordinary button instead (see .main.solo below).

     Styled after Adobe's own dark-UI push buttons: a flat fill, a 2px corner,
     and NO border. The border is what a native button does not have — the fill
     is what separates it from the panel behind it, and hover raises that fill
     rather than lighting an outline. All four read the same weight; none is
     tinted as a primary. */
  .tbtn {
    width:100%; min-height:42px; margin-bottom:3px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#2f2f2f; border:0; border-radius:var(--r-sm);
    color:var(--text); cursor:pointer; font:inherit; padding:5px 3px;
  }
  .tbtn:last-child { margin-bottom:0; }
  .tbtn:hover:not(:disabled) { background:#3d3d3d; color:var(--text); }
  .tbtn:active:not(:disabled) { background:#272727; }
  .tbtn:disabled { opacity:.4; cursor:default; }
  .tbtn svg { width:18px; height:18px; display:block; flex:0 0 auto; }
  /* margin rather than flex `gap` — that only landed in Chrome 84 and the
     manifest still claims CEP 9. */
  .tbtn span {
    margin-top:3px; max-width:100%;
    font-size:9px; font-weight:600; line-height:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ── Solo: the strip is the only thing in the row ──────────────────────────
     With the browser closed there is nothing to share the width with and
     nothing to drag against, so the strip takes the whole row and the grip
     goes away. At that width a stacked icon-over-label button reads as a tiny
     glyph marooned in a wide box, so the buttons become ordinary rows: icon,
     then label, left-aligned. */
  .main.solo .toolgrip { display:none; }
  .main.solo .tools    { flex:1; }
  .main.solo .tbtn {
    flex-direction:row; justify-content:flex-start;
    min-height:30px; padding:5px 9px;
  }
  .main.solo .tbtn svg { width:15px; height:15px; }
  .main.solo .tbtn span { margin-top:0; margin-left:8px; font-size:11px; }
  .main.solo .thead { font-size:9px; padding-bottom:4px; }

  /* ── Preset browser — hidden until the wand button is toggled ── */
  /* min-width:0 matters now that this is a flex item in a ROW: without it the
     grid's content sets a floor and the tool strip cannot be dragged wider. */
  .presets { display:none; flex:1; min-height:0; min-width:0; flex-direction:column; gap:5px; }
  .presets.open { display:flex; }

  .row { display:flex; align-items:center; gap:5px; flex:0 0 auto; }
  .path {
    flex:1; min-width:0; height:22px; padding:0 3px;
    background:#151515; border:1px solid var(--border); border-radius:var(--r);
    color:var(--text); font:inherit; font-size:10px; cursor:pointer;
  }
  .path:hover { border-color:var(--accent); }
  .path option { background:var(--panel); color:var(--text); }
  .path option:disabled { color:#5a5a5a; }

  /* New-category input row — collapsed unless the folder+ button opens it */
  .addcat { display:none; gap:5px; }
  .addcat.open { display:flex; }
  /* Confirm mode (.ask): the message takes the input's place and a Cancel
     button appears, so the destructive choice is never a single stray click. */
  .addcat .ask, .addcat .cancel { display:none; }
  /* The question WRAPS rather than ellipsising: at the 240px docked width the
     message gets ~119px, and a truncated "Delete "Kinetic Ty…?" would hide the
     very thing being confirmed. The row grows a line instead. */
  .addcat.ask { align-items:center; }
  .addcat.ask .ask {
    display:block; flex:1; min-width:0;
    font-size:10px; line-height:1.3; color:var(--text);
    white-space:normal; overflow-wrap:break-word; word-break:break-word;
  }
  .addcat.ask .txt { display:none; }
  .addcat.ask .cancel { display:block; }
  /* Search row. The magnifier is a sibling of the input rather than a
     background image, so it inherits colour and needs no asset. */
  .find .findico { flex:0 0 auto; width:11px; height:11px; color:var(--muted); }
  .find .findcount {
    flex:0 0 auto; font-size:9px; color:var(--muted); white-space:nowrap;
  }

  .txt {
    flex:1; min-width:0; height:22px; padding:0 6px;
    background:#151515; border:1px solid var(--border); border-radius:var(--r);
    color:var(--text); font:inherit; font-size:10px; outline:none;
    -webkit-user-select:text; user-select:text;
  }
  .txt:focus { border-color:var(--accent); }
  .txt::-webkit-input-placeholder { color:#5a5a5a; }

  /* Card grid — same shape as the ZeusPack app's asset grid: thumbnail on top,
     name beneath, accent border when selected. auto-fill so a narrow docked
     panel gets 2 columns and a wide floating one gets as many as fit. */
  .list {
    flex:1; min-width:0; min-height:60px; overflow-y:auto; overflow-x:hidden;
    background:#151515; border:1px solid var(--border); border-radius:var(--r);
    padding:4px;
    display:grid;
    /* Fixed track width, NOT minmax(...,1fr): a stretching track makes the real
       card width unknowable up front, and the thumbnail height has to be a
       definite px value to keep the tile at the preview's exact ratio.
       auto-fit, not auto-fill: auto-fill keeps generating empty tracks past the
       last card, which still take up space. Packed to the start so the leftover
       collects on the right instead of being split into a wide margin on both
       sides of the first card. */
    grid-template-columns:repeat(auto-fit, var(--card-w));
    justify-content:start;
    /* grid-gap for CEP 9 (Chromium 61) — plain `gap` only lands in Chrome 66 */
    grid-gap:3px; gap:3px;
    /* min-content, NOT the default `auto`: the list is a flex child with a
       definite height, and `auto` tracks soak up its spare height — the rows
       get divided evenly and every card is crushed to ~44px with its thumbnail
       clipped. Sizing rows to their content keeps cards intact and lets the
       grid overflow into a scroll instead. */
    grid-auto-rows:min-content;
    align-content:start;
  }
  .list.msg { display:block; padding:10px; }

  .card {
    background:#1b1b1b; border:1px solid var(--border); border-radius:var(--r);
    overflow:hidden; cursor:pointer; min-width:0;
  }
  .card:hover { border-color:#5a5a5a; }
  .card:hover .meta .nm { color:var(--text); }
  .card.sel   { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }

  /* Definite px height, not a percentage-padding aspect box: percentage padding
     contributes 0 to intrinsic sizing, so min-content rows came out short and
     clipped the name underneath. panel.js keeps --thumb-h at
     --card-w x (comp height / comp width). (inset:0 avoided — Chrome 87+.) */
  .thumb { position:relative; width:100%; height:var(--thumb-h); background:#0e0e0e; }
  .thumb > video, .thumb > img {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover; display:block;
  }
  .thumb .ph {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    color:#4a4a4a; font-size:15px; font-weight:600;
  }
  .thumb .ph.err { color:var(--err); font-size:9px; font-weight:400; text-align:center; padding:0 4px; }

  .meta { padding:2px 4px 3px; }
  /* Dimmer than the rest of the UI on purpose. A folder of cards is mostly
     name text, and at full white the grid reads as a wall of labels competing
     with the previews, which are the thing you are actually scanning. It
     brightens on hover and goes white when selected, so the card you are
     pointing at or have picked is always the loudest one. */
  .meta .nm {
    display:block; font-size:10px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card.sel .meta { background:var(--accent); }
  .card.sel .meta .nm { color:#fff; }

  .empty-list { color:var(--text); font-size:10px; text-align:center; }

  /* Corner badges on the thumbnail: which of the three sidecar files exist. */
  .tags { position:absolute; right:3px; bottom:3px; display:flex; gap:2px; }
  .tag {
    font-size:8px; line-height:1; padding:2px 3px; border-radius:var(--r-sm);
    background:rgba(0,0,0,.7); color:#c8c8c8; font-weight:600; letter-spacing:.2px;
  }
  .tag.aep { color:#8fb0ff; }   /* composition */
  .tag.ffx { color:#fbbf24; }   /* animation preset */
  .tag.zfx { color:#4ade80; }   /* ZeusPack preset — .ffx payload + expressions */

  /* Right-click menu — plain div, since CEP's native menu API is panel-wide
     and can't vary per card. */
  .menu {
    display:none; position:fixed; z-index:100; min-width:158px;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--r);
    padding:3px; box-shadow:0 4px 16px rgba(0,0,0,.55);
  }
  .menu.open { display:block; }
  .menu button {
    display:block; width:100%; text-align:left; padding:4px 8px;
    background:transparent; border:0; border-radius:var(--r-sm); cursor:pointer;
    color:var(--text); font:inherit; font-size:10px;
  }
  .menu button:hover:not(.off) { background:var(--accent); color:#fff; }
  /* Asset name inside a menu sentence. 600 rather than the default 700, which
     smears at 10px. */
  .menu button b { font-weight:600; }
  /* .off rather than [disabled]: a disabled button swallows pointer events, so
     its title tooltip never shows — and the unavailable items are exactly the
     ones whose tooltip explains why. */
  .menu button.off { color:#5a5a5a; cursor:default; }
  /* Destructive action — the item only opens a confirmation, it never acts. */
  .menu button.danger { color:var(--err); }
  .menu button.danger:hover { background:var(--err); color:#fff; }
  .menu .sep { height:1px; background:var(--border); margin:3px 2px; }

  /* ── Settings modal ──────────────────────────────────────────
     A dimmed full-panel overlay with a centred card. Shown by adding .open
     (default display:none), so nothing intercepts clicks while it is closed. */
  .modal {
    /* top/left/right/bottom rather than `inset` — inset shorthand only landed
       in Chrome 87, and the manifest still claims CEP 9 (Chromium 61). */
    display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:200;
    background:rgba(0,0,0,.55);
    align-items:center; justify-content:center; padding:12px;
  }
  .modal.open { display:flex; }
  .modalbox {
    width:100%; max-width:300px; max-height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--r);
    box-shadow:0 8px 28px rgba(0,0,0,.6);
  }
  .modalhead {
    display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-bottom:1px solid var(--border);
  }
  .modaltitle { flex:1; font-size:12px; font-weight:600; color:var(--text); }
  .modalx {
    width:20px; height:20px; padding:0; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border:0; border-radius:var(--r-sm);
    color:var(--muted); cursor:pointer;
  }
  .modalx:hover { color:var(--text); background:#3d3d3d; }
  .modalx svg { width:13px; height:13px; display:block; }

  .modalbody { padding:4px 10px; }
  .setrow {
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .setrow:last-child { border-bottom:0; }
  .setlabel { flex:1; min-width:0; }
  .setname { display:block; font-size:11px; font-weight:600; color:var(--text); }
  .setdesc { display:block; margin-top:2px; font-size:9px; line-height:1.35; color:var(--muted); }

  /* Two-option toggle. Same flush-segment idea as the top bar's .seg, but these
     are text pills, so they carry their own borders and share the middle edge. */
  .seg2 { display:flex; flex-shrink:0; }
  .seg2 .segopt {
    padding:4px 8px; font:inherit; font-size:10px; font-weight:600; white-space:nowrap;
    background:#151515; border:1px solid var(--border); color:var(--muted); cursor:pointer;
  }
  .seg2 .segopt + .segopt { border-left:0; }
  .seg2 .segopt:first-child { border-radius:var(--r-sm) 0 0 var(--r-sm); }
  .seg2 .segopt:last-child  { border-radius:0 var(--r-sm) var(--r-sm) 0; }
  .seg2 .segopt:hover { color:var(--text); }
  .seg2 .segopt.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  .modalfoot {
    padding:8px 10px; border-top:1px solid var(--border);
    font-size:9px; color:var(--muted); text-align:center;
  }

  .btn {
    height:22px; padding:0 9px; flex-shrink:0;
    background:transparent; border:1px solid var(--border); border-radius:var(--r);
    color:var(--text); cursor:pointer; font-size:10px; font-weight:600;
  }
  .btn:hover:not(:disabled) { color:var(--text); border-color:var(--accent); }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.primary { color:var(--accent); border-color:var(--accent); }
  .btn.danger { color:var(--err); border-color:var(--err); }
  .btn.danger:hover:not(:disabled) { background:var(--err); color:#fff; }

  /* Preview size — compact so it survives a 240px docked panel. */
  .size {
    -webkit-appearance:none; appearance:none;
    width:64px; height:22px; flex-shrink:0;
    background:transparent; cursor:pointer;
  }
  .size::-webkit-slider-runnable-track {
    height:3px; border-radius:var(--r-sm); background:var(--border);
  }
  .size::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:9px; height:9px; margin-top:-3px; border-radius:50%;
    background:var(--muted); border:0;
  }
  .size:hover::-webkit-slider-thumb { background:var(--accent); }

  /* Category rail on the left, grid on the right — the ZeusPack layout.
     No gap: the drag handle between them provides the separation. */
  .gridwrap { display:flex; flex:1; min-height:0; }

  /* Folder list — same shape as the ZeusPack sidebar's category rows. Width is
     a variable so the handle can drive it; definite (not flexible) so the
     grid's column maths stays predictable. */
  .cats {
    display:none; flex:0 0 var(--cats-w); min-width:0; overflow-y:auto;
    background:#151515; border:1px solid var(--border); border-radius:var(--r);
    padding:3px;
  }
  .cats.open { display:block; }

  /* Drag handle on the rail's right edge. Wider than it looks so it's
     actually grabbable — the visible line is only 1px. */
  .catgrip { display:none; flex:0 0 7px; position:relative; cursor:col-resize; }
  .catgrip.open { display:block; }
  .catgrip::after {
    content:""; position:absolute; top:0; bottom:0; left:3px; width:1px;
    background:transparent;
  }
  .catgrip:hover::after, .catgrip.drag::after { background:var(--accent); }
  .cats::-webkit-scrollbar { width:6px; }
  .cats::-webkit-scrollbar-track { background:transparent; }
  .cats::-webkit-scrollbar-thumb { background:#3f3f46; border-radius:99px; }

  .cat {
    display:flex; align-items:center; gap:6px;
    padding:2px 6px; border-radius:var(--r-sm); cursor:pointer;
    color:var(--text); font-size:10px;
  }
  .cat:hover { background:#1d1d1d; color:var(--text); }
  .cat.sel  { background:var(--accent); color:#fff; }
  /* Drop target while a card is being dragged over it. */
  .cat.drop { background:color-mix(in srgb, var(--accent) 30%, transparent);
              box-shadow:inset 0 0 0 1px var(--accent); color:var(--text); }
  /* "(Uncategorize)" — the leftovers bucket, pinned below the real categories
     and dimmed so the eye reads the named folders first. */
  /* Deliberately dim (see the note in :root). "(Uncategorize)" is not a
     category you made, it is the leftovers bucket for assets never filed into
     one, so it reads quieter than the real rows. Brightens on hover and goes
     full white when selected, so it never looks disabled. */
  .cat.root { color:#6a6a6a; font-style:italic; }
  .cat.root:hover { color:var(--text); }
  .cat.root.sel { color:#fff; font-style:normal; }
  .cat .cn  { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cat .cc  { flex-shrink:0; font-size:9px; opacity:.65; }
  .cat.sel .cc { opacity:.85; }

  /* Expand/collapse chevron — only rows with subcategories get a live one; a
     leaf row gets an invisible spacer of the same width so labels still line
     up. It owns its own click (stopPropagation'd in panel.js) so toggling
     never also selects the row or changes the grid's filter. */
  .cat .catToggle {
    flex-shrink:0; width:14px; text-align:center;
    font-size:12px; color:var(--text); cursor:pointer;
    /* line-height:1 so the taller glyph does not push the row height up: the
       10px label at 1.4 stays the tallest thing in the row. */
    line-height:1;
  }
  .cat .catToggle:hover { color:var(--text); }
  .cat .catToggle.spacer { visibility:hidden; cursor:default; }
  .cat.sel .catToggle { color:#fff; opacity:.8; }
  .cat.sel .catToggle:hover { opacity:1; }
</style>
</head>
<body>
  <div class="bar">
    <!-- Three zones: the segmented control is the middle one, so it centres in
         the bar while the status dot stays left and the actions stay right. The
         two side zones grow equally, which is what keeps the centre centred. -->
    <div class="barside left">
    <!-- The dot is the toggle for the status text beside it. Wrapped in a
         button purely for the hit area: an 8px circle is too small to click,
         but a bigger circle would shout louder than it deserves to. -->
    <button class="dotbtn" id="dotBtn" title="Show status text">
      <span class="dot" id="dot"></span>
    </button>
    <span class="state off" id="state">Connecting…</span>
    </div>

    <!-- The three view toggles are one segmented control: same kind of switch,
         so they sit flush rather than reading as three unrelated buttons. -->
    <div class="seg">
    <!-- Toggle preset browser -->
    <button class="ico lbl" id="presetBtn" title="Browse .ffx presets and .aep compositions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M17.8 6.2 19 5M3 21l9-9M12.2 6.2 11 5"/></svg>
      <span>Presets</span>
    </button>

    <!-- Toggle layer tools -->
    <button class="ico lbl" id="toolsBtn" title="Layer tools (group, ungroup, recenter)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M14 6h7M17.5 3v6M3 17.5h7"/></svg>
      <span>Tools</span>
    </button>

    <!-- Toggle log -->
    <button class="ico" id="logBtn" title="Show log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
    </button>
    </div>

    <!-- Right zone: the update notice and the settings gear. -->
    <div class="barside right">
    <!-- Update available — hidden until the GitHub check finds a newer tag -->
    <button class="ico lbl upd" id="updateBtn" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
      <span>Update</span>
    </button>
    <!-- Settings. Sits outside the segmented control because it opens a modal
         rather than toggling a view, so it should not read as a fourth switch. -->
    <button class="ico" id="settingsBtn" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    </div>
  </div>

  <!-- Preset browser and the tool strip sit side by side; the grip between
       them resizes the strip. The wrapper is hidden outright when both are
       closed, so an empty flex:1 row cannot hold the panel open. -->
  <div class="main" id="main">

  <!-- ── Preset browser ── -->
  <div class="presets" id="presets">
    <div class="row">
      <select class="path" id="pathSelect" title=""></select>
      <button class="ico lbl" id="loopBtn" title="Preview playback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span id="loopLbl">Loop</span>
      </button>
      <button class="ico" id="refreshBtn" title="Rescan folder (also drops categories whose folder is gone)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>

    <!-- Search. Its own row rather than sharing the toolbar: at the 240px
         docked minimum the path dropdown, Loop and Refresh already fill that
         row, and a field squeezed in beside them would be unusable. -->
    <div class="row find">
      <svg class="findico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        ><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" class="txt" id="findInput" placeholder="Search presets…"
             spellcheck="false" autocomplete="off" maxlength="80" />
      <span class="findcount" id="findCount"></span>
    </div>

    <!-- Shared name input: new category, new asset. Hidden until asked for. -->
    <div class="row addcat" id="promptRow">
      <!-- In confirm mode the message replaces the input: there is nothing to
           type, only a decision to take. -->
      <span class="ask" id="promptMsg"></span>
      <input type="text" class="txt" id="promptInput" placeholder="Category name…"
             spellcheck="false" maxlength="60" />
      <button class="btn cancel" id="promptCancel">Cancel</button>
      <button class="btn" id="promptOk">Add</button>
    </div>

    <!-- Category rail + drag handle + grid, side by side -->
    <div class="gridwrap">
      <div class="cats" id="cats"></div>
      <div class="catgrip" id="catGrip" title="Drag to resize"></div>
      <div class="list msg" id="list">
        <div class="empty-list">Loading…</div>
      </div>
    </div>

    <div class="row">
      <!-- min/max are set from JS; max is the current grid width, so the far
           end is one card per row. step MUST stay 1: a range input can only
           land on min + n*step, so a coarser step would make the max itself
           unreachable and the far end would never register as "fit". -->
      <input type="range" class="size" id="sizeSlider" min="72" max="200" step="1"
             title="Preview size" />
      <button class="btn primary" id="applyBtn" disabled
              title="Apply the preset (entrance keyframes only)">Apply In</button>
      <button class="btn" id="applyOutBtn" disabled
              title="Apply the entrance keyframes, then time-reverse them">Apply Out</button>
    </div>
  </div>

    <!-- ── Layer tools ── -->
    <div class="toolgrip" id="toolGrip" title="Drag to resize"></div>
    <div class="tools" id="tools">
      <div class="tgroup">
      <div class="thead">
        <span class="tname" title="Null Parent">Null Parent</span>
      </div>
      <button class="tbtn" id="groupBtn"
              title="Quick Parent: Parent the selected layers to a null placed at their center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 3"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/></svg>
        <span>Parent</span>
      </button>
      <button class="tbtn" id="ungroupBtn"
              title="Clear Parent: Release the group's layers and delete its null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="7" height="7" rx="1"/><path d="M4 4l3 3M20 4l-3 3M4 20l3-3M20 20l-3-3"/></svg>
        <span>UnParent</span>
      </button>
      <button class="tbtn" id="recenterBtn"
              title="Recenter: Move the group's null back to the center of its layers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span>Recenter</span>
      </button>
      </div>

      <div class="tgroup">
      <div class="thead"><span class="tname">Other</span></div>

      <button class="tbtn" id="decomposeBtn"
              title="Decompose: Lift a precomp's layers back into this comp, keeping them where they looked. Each layer comes across whole, including its own effects, masks, keyframes and expressions. Only things applied TO the precomp layer (effects, masks, blend mode) cannot follow, because they act on the flattened result; those are named in the log.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><path d="M14 4h6M17 1v6M14 20h6M17 17v6M4 14v6h6" stroke-dasharray="0"/><path d="M13 13l7 7"/></svg>
        <span>Decompose</span>
      </button>
      </div>
    </div>
  </div>

  <div class="log" id="log">
    <div class="logbar">
      <!-- Lives here rather than in the status bar: its whole output is log
           lines, so it belongs with them. -->
      <button class="ico lbl" id="testBtn" title="Test: read the active project">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Test</span>
      </button>
    </div>
    <div class="loglines" id="logLines"></div>
  </div>

  <!-- Card right-click menu; items are rebuilt per card -->
  <div class="menu" id="menu"></div>

  <!-- Settings, opened by right-clicking the Presets toggle. A centred modal
       rather than another floating menu: it gathers the panel's persistent
       preferences (which otherwise live on scattered quick-toggles) in one
       place, with room for a label and a line of explanation each. -->
  <div class="modal" id="settingsModal">
    <div class="modalbox" role="dialog" aria-label="Settings">
      <div class="modalhead">
        <span class="modaltitle">Settings</span>
        <button class="modalx" id="settingsClose" title="Close (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <div class="modalbody">

        <div class="setrow">
          <div class="setlabel">
            <span class="setname">Preview playback</span>
            <span class="setdesc">Loop every preview, or play only the one under the pointer.</span>
          </div>
          <div class="seg2" id="setPlayback">
            <button class="segopt" data-v="loop">Loop all</button>
            <button class="segopt" data-v="hover">Hover only</button>
          </div>
        </div>

        <div class="setrow">
          <div class="setlabel">
            <span class="setname">Null placement</span>
            <span class="setdesc">Where a null lands when grouping and recentring layers.</span>
          </div>
          <div class="seg2" id="setCenter">
            <button class="segopt" data-v="bounds">Bounding box</button>
            <button class="segopt" data-v="anchor">Anchor point</button>
          </div>
        </div>

        <div class="setrow">
          <div class="setlabel">
            <span class="setname">Status text</span>
            <span class="setdesc">Show the message beside the connection dot in the top bar.</span>
          </div>
          <div class="seg2" id="setStatus">
            <button class="segopt" data-v="on">Show</button>
            <button class="segopt" data-v="off">Hide</button>
          </div>
        </div>

      </div>
      <div class="modalfoot">
        <span id="settingsVersion">ZeusPack</span>
      </div>
    </div>
  </div>

  <script src="./js/CSInterface.js"></script>
  <script src="./js/panel.js"></script>
</body>
</html>
