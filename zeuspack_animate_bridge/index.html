<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ZeusPack Bridge</title>
<style>
  :root {
    --bg:#1e1e1e; --panel:#252526; --border:#3a3a3a;
    --text:#e6e6e6; --muted:#9a9a9a; --accent:#6c8cff;
    --ok:#3fb950; --err:#f85149;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body {
    background:var(--bg); color:var(--text);
    font:11px/1.4 "Inter", -apple-system, Segoe UI, sans-serif;
    display:flex; flex-direction:column; padding:5px 7px; gap:5px;
  }

  /* One compact status row: dot + state + actions. flex:0 0 auto so the row
     never stretches — collapsed, the body is exactly this tall. */
  .bar { flex:0 0 auto; display:flex; align-items:center; gap:7px; height:22px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.ok { background:var(--ok); } .dot.err { background:var(--err); }
  .state { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
  .state b { color:var(--text); font-weight:600; }

  .ico {
    width:22px; height:22px; padding:0; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--border); border-radius:5px;
    color:var(--muted); cursor:pointer;
  }
  .ico:hover { color:var(--text); border-color:var(--accent); }
  .ico:disabled { opacity:.4; cursor:default; }
  .ico.on { color:var(--accent); border-color:var(--accent); }
  .ico svg { width:12px; height:12px; display:block; }

  /* Log — collapsed by default, only takes space when opened */
  .log {
    display:none; flex:1; min-height:70px; overflow:auto;
    background:#151515; border:1px solid var(--border); border-radius:5px;
    padding:5px 6px; font-family:Consolas, monospace; font-size:10px;
    color:var(--muted); white-space:pre-wrap; word-break:break-word;
  }
  .log.open { display:block; }
  .log .ok  { color:var(--ok); }
  .log .err { color:var(--err); }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot" id="dot"></span>
    <span class="state" id="state">Connecting…</span>

    <!-- Test connection (icon only) -->
    <button class="ico" id="testBtn" title="Test: read active document">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>

    <!-- Toggle log -->
    <button class="ico" id="logBtn" title="Show log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
    </button>
  </div>

  <div class="log" id="log"></div>

  <script src="./js/CSInterface.js"></script>
  <script src="./js/panel.js"></script>
</body>
</html>
